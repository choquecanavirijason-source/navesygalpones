<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon del sitio. Next lo sirve solo por convención de archivo (`app/icon.svg`).

  Es el isotipo de `public/logos/logo.svg` centrado en un lienzo cuadrado: el original es
  apaisado (533.9 × 418.5) y un favicon tiene que ser cuadrado. El fondo blanco mantiene
  legibles tanto las partes claras como las oscuras del degradado, que sobre grafito se
  perderían, y funciona igual en pestañas claras y oscuras.
-->
